[package]
name = "uyaref"
version = "0.1.0"
edition = "2024"

# The emulated reference (PLAN item 0.6), a tool of its own: rac-rs's PS2 core and the instruments that set the port against it,
# the way the original game's own pictures, sounds and movies are compared until the PCSX2 reference exists (PLAN item 11). Not
# the game: port/'s workspace (the game) neither builds nor reads any of this. Built by `scripts\build.ps1 -Package uyaref`.
[dependencies]
# The port's own code as a library: the native renderer, the sound engine, the movie decoder, the jobs and pictures it reads.
uya = { path = "../uya" }
uyafmt = { path = "../uyafmt" }
# rac-rs's PS2 core (recompiled code runtime, emulated VIF/VU1/GS, 989snd and SPU2) with this game's native VU1 programs (feature
# uya-aot, generated by scripts/uya_vugen.py), and the game's EE code recompiled for it (generated/uya, scripts/uya-recgen.py,
# gitignored; a build without it fails).
ee-oracle = { path = "../../extern/rac-rs/oracle", default-features = false }
rac-engine = { path = "../../extern/rac-rs/rac-rs/crates/engine", default-features = false, features = ["uya-aot"] }
ee-game-rc3 = { path = "../../generated/uya/game" }

# A workspace of its own, with its own Cargo.lock and target folder (port/uyaref/target), so that port/'s workspace never reads
# this manifest or rac-rs's: the game builds with no extern/ or generated/ on disk.
[workspace]
resolver = "3"

# The same wgpu-hal as the game's (port/vendor/wgpu-hal/README_PORT.txt): cargo reads [patch] only at a workspace's root.
[patch.crates-io]
wgpu-hal = { path = "../vendor/wgpu-hal" }

# As port/'s release profile: line tables for this crate only.
[profile.release]
opt-level = 3
debug = 1

[profile.release.package."*"]
debug = 0
